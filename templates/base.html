<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Mock SAT{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='vendor/katex/katex.min.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
<script defer src="{{ url_for('static', filename='vendor/katex/katex.min.js') }}"></script>
<script defer src="{{ url_for('static', filename='vendor/katex/contrib/auto-render.min.js') }}"></script>
{% block head %}{% endblock %}
</head>
<body class="{% block bodyclass %}{% endblock %}">
{% block chrome %}
<header class="topbar">
  <a class="brand" href="{{ url_for('home') }}">Mock SAT</a>
  <nav>
    <a href="{{ url_for('home') }}" {% if request.endpoint == 'home' %}class="on"{% endif %}>Home</a>
    <a href="{{ url_for('practice') }}" {% if request.endpoint == 'practice' %}class="on"{% endif %}>Practice</a>
    <a href="{{ url_for('exam') }}" {% if request.endpoint == 'exam' %}class="on"{% endif %}>Mock exam</a>
    <a href="{{ url_for('dashboard_view') }}" {% if request.endpoint == 'dashboard_view' %}class="on"{% endif %}>Dashboard</a>
    <a href="{{ url_for('skills_index') }}" {% if request.endpoint in ('skills_index', 'lecture') %}class="on"{% endif %}>Skills and lectures</a>
  </nav>
  {% if s %}<span class="who">{{ s['name'] }}<a href="{{ url_for('logout') }}">Switch student</a></span>{% endif %}
</header>
<main class="frame">
{% block content %}{% endblock %}
</main>
{% endblock %}
<script>
  window.addEventListener('DOMContentLoaded', function () {
    if (window.renderMathInElement) renderMathInElement(document.body, {delimiters: [{left: '\\(', right: '\\)', display: false}, {left: '\\[', right: '\\]', display: true}], throwOnError: false});
  });
</script>
{% block scripts %}{% endblock %}
</body>
</html>
